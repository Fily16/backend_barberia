# ========================================
# Ralph Cuts Academy - PRODUCTION (Render)
# ========================================

server.port=${PORT:8080}

# ========================================
# PostgreSQL - Render (Environment Variables)
# ========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# JWT
# ========================================
jwt.secret=${JWT_SECRET:UmFscGhDdXRzQWNhZGVteTIwMjVTZWNyZXRLZXlGb3JKV1RBdXRoZW50aWNhdGlvbk11c3RCZUE=}
jwt.expiration=86400000

# ========================================
# CORS - Production
# ========================================
cors.allowed-origins=${CORS_ORIGINS:https://ralph-cuts-academy.vercel.app}

# ========================================
# Resend (Email HTTP API)
# ========================================
resend.api-key=${RESEND_API_KEY:}

# ========================================
# Bunny Stream
# ========================================
bunny.stream.api-key=${BUNNY_API_KEY:default-key}
bunny.stream.auth-key=${BUNNY_AUTH_KEY:default-key}
bunny.stream.library-id=${BUNNY_LIBRARY_ID:590927}
bunny.stream.cdn-hostname=${BUNNY_CDN_HOSTNAME:vz-e7443a92-10a.b-cdn.net}
bunny.stream.api-url=https://video.bunnycdn.com
bunny.stream.account-api-key=${BUNNY_ACCOUNT_API_KEY:default-key}
