# ========================================
# Ralph Cuts Academy - PRODUCTION (Render)
# ========================================

server.port=${PORT:8080}

# ========================================
# PostgreSQL - Render (Environment Variables)
# ========================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# JWT
# ========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ========================================
# CORS - Production
# ========================================
cors.allowed-origins=${CORS_ORIGINS:https://ralph-cuts-academy.vercel.app}

# ========================================
# Bunny Stream
# ========================================
bunny.stream.api-key=${BUNNY_API_KEY}
bunny.stream.auth-key=${BUNNY_AUTH_KEY}
bunny.stream.library-id=${BUNNY_LIBRARY_ID}
bunny.stream.cdn-hostname=${BUNNY_CDN_HOSTNAME}
bunny.stream.api-url=https://video.bunnycdn.com
bunny.stream.account-api-key=${BUNNY_ACCOUNT_API_KEY}
