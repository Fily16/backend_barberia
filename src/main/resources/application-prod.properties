# ========================================
# Ralph Cuts Academy - PRODUCCIÓN (Render)
# ========================================

server.port=${PORT:8080}

# ========================================
# PostgreSQL - Render (Variables de Entorno)
# ========================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# JWT
# ========================================
jwt.secret=${JWT_SECRET:UmFscGhDdXRzQWNhZGVteTIwMjVTZWNyZXRLZXlGb3JKV1RBdXRoZW50aWNhdGlvbk11c3RCZUE=}
jwt.expiration=86400000

# ========================================
# CORS - Producción
# ========================================
cors.allowed-origins=${CORS_ORIGINS:https://ralph-cuts-academy.vercel.app,https://tu-dominio.com}
